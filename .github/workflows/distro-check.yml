name: CI / Native Distro Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Native Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian
            image: debian:12-slim
            experimental: false
            install: apt-get update && apt-get install -y bash ca-certificates coreutils curl gawk git grep python3 sed iproute2 clang llvm libbpf-dev build-essential gcc-multilib bpftool
          - name: ubuntu
            image: ubuntu:24.04
            experimental: false
            install: apt-get update && apt-get install -y bash ca-certificates coreutils curl gawk git grep python3 sed iproute2 clang llvm libbpf-dev build-essential gcc-multilib linux-tools-common linux-tools-generic; bpftool_path="$(find /usr/lib/linux-tools -name bpftool -print -quit)"; test -x "$bpftool_path"; ln -sf "$bpftool_path" /usr/local/bin/bpftool; bpftool version
          - name: fedora
            image: fedora:41
            experimental: false
            install: dnf -y install bash ca-certificates coreutils curl gawk git grep python3 sed iproute clang llvm libbpf-devel bpftool gcc make
          - name: opensuse
            image: opensuse/tumbleweed
            experimental: true
            install: zypper --non-interactive refresh && zypper --non-interactive install -y bash ca-certificates coreutils curl gawk git grep python3 sed iproute2 clang llvm libbpf-devel bpftool gcc make
          - name: arch
            image: archlinux:latest
            experimental: true
            install: "pacman -Sy --noconfirm --needed bash ca-certificates coreutils curl gawk git grep python sed iproute2 clang llvm libbpf base-devel bpf"
          - name: alpine
            image: alpine:3.20
            experimental: false
            install: apk add --no-cache bash ca-certificates coreutils curl gawk git grep python3 sed iproute2 clang llvm libbpf-dev bpftool build-base linux-headers
          - name: almalinux
            image: almalinux:10
            experimental: false
            install: dnf -y --allowerasing install bash ca-certificates coreutils curl gawk git grep python3 sed iproute clang llvm libbpf-devel bpftool gcc make
          - name: rockylinux
            image: rockylinux:9
            experimental: false
            install: dnf -y install dnf-plugins-core && dnf config-manager --enable crb && dnf -y --allowerasing install bash ca-certificates coreutils curl gawk git grep python3 sed iproute clang llvm libbpf-devel bpftool gcc make
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        run: ${{ matrix.install }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          for command_name in bash clang llvm-strip bpftool ip python3; do
            command -v "$command_name"
          done
          clang --version
          bpftool version

      - name: Build BPF objects natively on ${{ matrix.name }}
        shell: bash
        run: bash ./tests/bash/test_bpf_build.sh

  kernel-integration:
    name: Kernel Load + XDP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: debian:12-slim
      options: --privileged
    steps:
      - name: Install kernel test dependencies
        run: |
          apt-get update
          apt-get install -y bash clang llvm libbpf-dev bpftool iproute2 python3 util-linux
          if [ "$(uname -m)" = "x86_64" ]; then
            apt-get install -y gcc-multilib
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Mount BPF filesystem
        run: |
          mkdir -p /sys/fs/bpf
          mountpoint -q /sys/fs/bpf || mount -t bpf bpf /sys/fs/bpf

      - name: Report kernel and BPF environment
        shell: bash
        run: |
          set -Eeuo pipefail
          uname -a
          clang --version
          bpftool version
          ip -Version
          mountpoint /sys/fs/bpf
          ulimit -l
          bpftool feature probe kernel 2>&1 || echo "warning: kernel feature probe failed"

      - name: Load, attach, and exercise the XDP program
        shell: bash
        run: |
          set -Eeuo pipefail
          integration_log="$GITHUB_WORKSPACE/kernel-integration.log"
          bash ./tests/bash/test_integration.sh 2>&1 | tee "$integration_log"
          grep -Eq '^all [1-9][0-9]* tests passed$' "$integration_log"

      - name: Upload kernel verifier diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-integration-debug-${{ github.run_id }}
          path: kernel-integration.log
          if-no-files-found: warn
          retention-days: 7
