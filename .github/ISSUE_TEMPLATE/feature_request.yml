name: Feature request
description: Propose a focused improvement to Auto XDP
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Feature requests work best when they describe a concrete use case and desired outcome. If you need help using Auto XDP, choose the **Question** form instead.

  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to accomplish?
      description: Describe the setup, workflow, or use case and who would benefit.
      placeholder: On hosts with multiple public interfaces, I need to ...
    validations:
      required: true

  - type: textarea
    id: limitation
    attributes:
      label: What prevents this today?
      description: Explain the current behavior, limitation, or workaround and why it is insufficient.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What would a successful solution look like?
      description: Describe the observable result without requiring a particular implementation.
      placeholder: I should be able to ... while Auto XDP continues to ...
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach (optional)
      description: Share an API, command, configuration example, or implementation idea if you have one.

  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Installer, upgrade, or uninstall
        - Service or port discovery
        - XDP/eBPF backend
        - nftables fallback
        - CLI or TUI
        - Custom handlers
        - Configuration
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, screenshots, prior art, or constraints that clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find this request.
          required: true
        - label: This request describes one focused problem.
          required: true
